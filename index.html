<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Document Title</title>
    <link rel="stylesheet" href="bootstrap.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-dark">
      <div class="container">
        <div
          class="row justify-content-center text-center align-items-center vh-100 w-100 flex-column gap-3"
        >
          <div class="text-white fw-bolder fs-1">
            <span data-hour>00</span>
            :
            <span data-minute>00</span>
            :
            <span data-second>00</span>
            <span data-am-pm class="fw-bold fs-3"></span>
          </div>
          <div class="text-white fw-bold fs-3">
            <span data-year></span>
            /
            <span data-month></span>
            /
            <span data-day></span>
          </div>
          <div class="text-white fw-bold fs-6">
            <span>YEAR</span>
            /
            <span>MONTH</span>
            /
            <span>DAY</span>
          </div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
